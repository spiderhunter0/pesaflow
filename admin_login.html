<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Pesa Flow · Admin sign in</title><style>:root{color-scheme:dark;--bg:#0b1120;--panel:#111c30;--line:#263750;--text:#edf4ff;--muted:#9aabc2;--accent:#61e6b4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 20% 0%,#18304a,transparent 42%),var(--bg);font:15px system-ui;color:var(--text)}main{width:min(100%,440px);padding:29px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 24px 80px #0006}.brand{display:flex;gap:12px;align-items:center;margin-bottom:25px}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#123e38;color:var(--accent);font-weight:800;font-size:22px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.16em;font-weight:800}h1{font-size:27px;margin:8px 0}p{color:var(--muted);line-height:1.5}.field{margin:17px 0}label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #354761;background:#0b1424;color:var(--text);font:inherit}button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#06251d;font-weight:750;font-size:15px;margin-top:8px}.notice{min-height:25px;color:#ff9292;font-size:13px}.foot{border-top:1px solid var(--line);padding-top:15px;margin-top:18px;font-size:12px;color:var(--muted)}</style><style>.visibility-toggle{width:auto!important;min-width:68px;padding:6px 12px;margin-top:6px;cursor:pointer}</style></head><body><main><div class="brand"><div class="mark">P</div><div><div class="eyebrow">PESA FLOW</div><strong>Private administration</strong></div></div><h1>Administrator sign in</h1><p>Use your separate administrator credentials. This sign-in does not use your normal account.</p><form id="f"><div class="field"><label for="pw">Admin password</label><input id="pw" type="password" required maxlength="256" autocomplete="current-password"><button type="button" class="visibility-toggle" aria-controls="pw" aria-pressed="false" onclick="toggleAdminField('pw',this)">Show</button></div><div class="field"><label for="key">Secret access key</label><input id="key" type="password" required maxlength="256" autocomplete="off"><button type="button" class="visibility-toggle" aria-controls="key" aria-pressed="false" onclick="toggleAdminField('key',this)">Show</button></div><div class="field"><label id="ql" for="ans">Security question</label><input id="ans" type="password" required maxlength="256" autocomplete="off"><button type="button" class="visibility-toggle" aria-controls="ans" aria-pressed="false" onclick="toggleAdminField('ans',this)">Show</button></div><button id="go">Secure sign in</button><div id="msg" class="notice" role="status" aria-live="polite"></div></form><div class="foot">Admin sessions expire after four hours. Credentials are stored as salted hashes.</div></main><script>function toggleAdminField(id,button){const field=document.getElementById(id);const reveal=field.type==='password';field.type=reveal?'text':'password';button.textContent=reveal?'Hide':'Show';button.setAttribute('aria-pressed',String(reveal));}</script><script>
(async()=>{try{const r=await fetch('/api/admin/question',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.detail||'Question unavailable');ql.textContent=d.question;ans.type='text'}catch(e){msg.textContent=e.message}})();f.onsubmit=async e=>{e.preventDefault();go.disabled=true;msg.textContent='Verifying…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value,access_key:key.value,answer:ans.value})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Sign in failed');location.replace('/admin-home')}catch(e){msg.textContent=e.message;go.disabled=false}};
</script></body></html>
