<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pesa Flow — Secure sign in</title>
<style>
:root{color-scheme:light;--nav:#133b34;--green:#087f68;--ink:#172b2a;--muted:#71817e;--line:#e7edeb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#edf5f1,#f8faf9 60%,#e4f1eb);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.card{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 70px #133b3414}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.mark{width:46px;height:46px;border-radius:15px;background:#c9ef8a;color:var(--nav);display:grid;place-items:center;font-size:23px;font-weight:900}.brand strong{font-size:21px;letter-spacing:-.6px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.6px;font-weight:700}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}h1{font-size:28px;letter-spacing:-.9px;margin:5px 0 6px}p{color:var(--muted);margin:0 0 22px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;font-weight:750}.field input{width:100%;padding:13px 14px;border:1px solid #dce6e1;border-radius:11px;font:inherit;outline:none}.field input:focus{border-color:#4b9b87;box-shadow:0 0 0 3px #087f6818}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:var(--green);color:white;font:inherit;font-weight:800;margin-top:8px;cursor:pointer}.switch,.linkbtn{border:0;background:transparent;color:var(--green);font:inherit;font-weight:750;padding:14px 0 0;width:100%;cursor:pointer}.error{display:none;margin:12px 0;padding:11px 13px;border-radius:10px;background:#fff0f0;color:#a12e2e;font-size:13px}.hint{font-size:12px;margin-top:16px;line-height:1.55}.hidden{display:none!important}.security{font-size:11px;color:var(--muted);text-align:center;margin-top:22px}.status{min-height:18px;font-size:13px;margin-top:10px;color:var(--green)}
</style></head><body><main class="card"><div class="brand"><div class="mark">PF</div><div><strong>Pesa Flow</strong><small>MONEY, IN FLOW</small></div></div><div class="eyebrow">PRIVATE FINANCE WORKSPACE</div><h1 id="heading">Welcome back</h1><p id="subtitle">Sign in to securely access your money overview.</p><div id="error" class="error" role="alert"></div>
<form id="loginForm"><div class="field"><label for="loginEmail">Email address</label><input id="loginEmail" type="email" autocomplete="username" maxlength="254" required></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" maxlength="128" required></div><button class="btn" type="submit">Sign in securely</button><button id="forgotLink" class="linkbtn" type="button">Forgot your password?</button></form>
<form id="registerForm" class="hidden"><div class="field"><label for="registerName">Full name</label><input id="registerName" type="text" autocomplete="name" minlength="2" maxlength="80" required placeholder="e.g. Joseph Mwangi"></div><div class="field"><label for="registerEmail">Email address</label><input id="registerEmail" type="email" autocomplete="email" maxlength="254" required></div><div class="field"><label for="registerPassword">Password (12 characters minimum)</label><input id="registerPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><button class="btn" type="submit">Create secure account</button></form>
<form id="forgotForm" class="hidden"><div class="field"><label for="forgotEmail">Account email address</label><input id="forgotEmail" type="email" autocomplete="email" maxlength="254" required></div><button class="btn" type="submit">Send reset link</button><button id="backLogin" class="switch" type="button">Back to sign in</button></form>
<form id="resetForm" class="hidden"><div class="field"><label for="newPassword">New password (12 characters minimum)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></div><button class="btn" type="submit">Reset password</button></form>
<div id="status" class="status" role="status" aria-live="polite"></div><button id="switch" class="switch" type="button">Create an account</button><div class="hint">Your finance records are stored in a separate database for your account. Use a unique password and never share it.</div><div class="security">Secure session · Passwords are never stored in plain text</div></main>
<script>
const $=id=>document.getElementById(id);let mode='login',registrationEnabled=true,resetToken=new URLSearchParams(location.search).get('reset_token')||'';
function showError(s){$('error').textContent=s;$('error').style.display='block'}function clearError(){$('error').style.display='none';$('error').textContent=''}
function setMode(next){mode=next;clearError();$('status').textContent='';for(const id of ['loginForm','registerForm','forgotForm','resetForm'])$(id).classList.toggle('hidden',({login:'loginForm',register:'registerForm',forgot:'forgotForm',reset:'resetForm'})[mode]!==id);$('heading').textContent=({login:'Welcome back',register:'Create your account',forgot:'Reset your password',reset:'Choose a new password'})[mode];$('subtitle').textContent=({login:'Sign in to securely access your money overview.',register:'Set up your private Pesa Flow workspace.',forgot:'Enter your account email and we will send a secure reset link if email delivery is configured.',reset:'Choose a strong new password to secure your account.'})[mode];$('switch').classList.toggle('hidden',!registrationEnabled||mode==='forgot'||mode==='reset');$('forgotLink').classList.toggle('hidden',mode!=='login');$('switch').textContent=mode==='login'?'Create an account':'Back to sign in';}
$('switch').addEventListener('click',()=>setMode(mode==='login'?'register':'login'));$('forgotLink').addEventListener('click',()=>{$('forgotEmail').value=$('loginEmail').value;setMode('forgot')});$('backLogin').addEventListener('click',()=>setMode('login'));
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'same-origin'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||'Request failed');return d}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();clearError();try{await post('/api/login',{email:$('loginEmail').value,password:$('loginPassword').value});location.replace('/dashboard')}catch(err){showError(err.message)}});
$('registerForm').addEventListener('submit',async e=>{e.preventDefault();clearError();try{await post('/api/register',{full_name:$('registerName').value.trim(),email:$('registerEmail').value,password:$('registerPassword').value});location.replace('/dashboard')}catch(err){showError(err.message)}});
$('forgotForm').addEventListener('submit',async e=>{e.preventDefault();clearError();$('status').textContent='Sending request…';try{const d=await post('/api/password-reset/request',{email:$('forgotEmail').value.trim()});$('status').textContent=d.message||'If the account exists, reset instructions will be sent.'}catch(err){$('status').textContent='';showError(err.message)}});
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();clearError();if($('newPassword').value!==$('confirmPassword').value){showError('The passwords do not match.');return}try{const d=await post('/api/password-reset/confirm',{token:resetToken,password:$('newPassword').value});resetToken='';history.replaceState({},'',location.pathname);setMode('login');$('status').textContent=d.message||'Password reset. Please sign in.'}catch(err){showError(err.message)}});
(async()=>{try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();registrationEnabled=!!d.registration_enabled;$('switch').classList.toggle('hidden',!registrationEnabled);if(resetToken)setMode('reset');else setMode('login')}catch{showError('Could not connect to the server. Please refresh and try again.')}})();
</script></body></html>
